<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva de turnos ALCPT</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-light: #E6F1FB; --blue-mid: #378ADD; --blue-dark: #185FA5; --blue-text: #0C447C;
    --green-light: #EAF3DE; --green-dark: #27500A; --green-mid: #3B6D11; --green-str: #97C459;
    --red-light: #FCEBEB; --red-dark: #791F1F; --red-str: #F09595;
    --amber-light: #FAEEDA; --amber-dark: #412402; --amber-str: #FAC775;
    --gray-light: #F1EFE8; --gray-mid: #888780; --gray-dark: #2C2C2A;
    --border: rgba(0,0,0,0.12);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f3; min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 2rem 1rem; color: #1a1a18;
  }
  .card { background: #fff; border-radius: 12px; border: 0.5px solid var(--border); padding: 2rem; width: 100%; max-width: 560px; }
  .encabezado { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--border); }
  .escudo { width: 52px; height: 52px; margin: 0 auto 12px; background: var(--blue-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; }
  .encabezado h1 { font-size: 17px; font-weight: 600; color: var(--gray-dark); margin-bottom: 4px; }
  .encabezado p  { font-size: 13px; color: var(--gray-mid); }
  .badge { display: inline-block; background: var(--blue-light); color: var(--blue-text); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; letter-spacing: 0.3px; }

  .field { margin-bottom: 1.25rem; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; font-size: 14px; border: 0.5px solid var(--border); border-radius: 8px; outline: none; background: #fff; color: var(--gray-dark); transition: border-color 0.15s; }
  .field input:focus { border-color: var(--blue-mid); box-shadow: 0 0 0 3px rgba(55,138,221,0.12); }

  .turnos-label { font-size: 12px; font-weight: 600; color: var(--gray-mid); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .turnos-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }

  /* Skeleton loader */
  .skeleton { background: linear-gradient(90deg, var(--gray-light) 25%, #e8e6e0 50%, var(--gray-light) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; height: 68px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  .turno { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.18s, background 0.18s, transform 0.12s; user-select: none; }
  .turno:not(.lleno):not(.seleccionado):hover { border-color: var(--blue-mid); background: var(--blue-light); transform: translateY(-1px); }
  .turno.seleccionado { border-color: var(--blue-dark); background: var(--blue-light); }
  .turno.lleno { background: var(--gray-light); cursor: not-allowed; opacity: 0.6; }

  .turno-info { display: flex; flex-direction: column; gap: 3px; }
  .turno-hora { font-size: 15px; font-weight: 600; color: var(--gray-dark); }
  .turno-desc { font-size: 12px; color: var(--gray-mid); }
  .turno-cupos { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .cupos-texto { font-size: 12px; font-weight: 600; }
  .cupos-bar { width: 80px; height: 5px; background: var(--gray-light); border-radius: 3px; overflow: hidden; }
  .cupos-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

  .tag-libre  { color: var(--green-mid); }
  .tag-poco   { color: #BA7517; }
  .tag-lleno  { color: var(--red-dark); }
  .fill-libre { background: var(--green-mid); }
  .fill-poco  { background: #EF9F27; }
  .fill-lleno { background: #A32D2D; }
  .tag-seleccionado { font-size: 11px; font-weight: 600; color: var(--blue-dark); background: var(--blue-light); border: 0.5px solid var(--blue-mid); padding: 2px 8px; border-radius: 20px; }

  /* Aviso turno lleno al intentar registrar */
  .aviso-lleno {
    display: none; background: var(--red-light); color: var(--red-dark);
    border: 0.5px solid var(--red-str); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; margin-bottom: 1rem;
    animation: fadeDown 0.3s ease;
  }
  .aviso-lleno.visible { display: block; }
  @keyframes fadeDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

  .btn { display: block; width: 100%; padding: 11px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; text-align: center; transition: background 0.15s, transform 0.1s; border: none; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--blue-dark); color: #fff; }
  .btn-primary:hover { background: var(--blue-text); }
  .btn:disabled { background: var(--gray-light); color: var(--gray-mid); cursor: not-allowed; transform: none; }

  .envio-estado { text-align: center; font-size: 13px; padding: 12px; border-radius: 8px; margin-top: 1rem; display: none; }
  .envio-estado.enviando { background: var(--blue-light);  color: var(--blue-text);  display: block; }
  .envio-estado.ok       { background: var(--green-light); color: var(--green-dark); display: block; }
  .envio-estado.error    { background: var(--red-light);   color: var(--red-dark);   display: block; }

  .screen { display: none; }
  .screen.active { display: block; }

  .exito-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--green-light); border: 2px solid var(--green-str); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 1rem; }
  .exito-card { background: var(--gray-light); border-radius: 8px; padding: 14px 16px; font-size: 13px; color: var(--gray-mid); margin: 1rem 0; line-height: 1.8; text-align: left; }
  .exito-card strong { color: var(--gray-dark); }

  .refresh-btn { background: none; border: none; color: var(--blue-mid); font-size: 12px; cursor: pointer; font-weight: 600; padding: 0; }
  .refresh-btn:hover { color: var(--blue-dark); }

  @media (max-width: 480px) { body { padding: 1rem 0.5rem; } .card { padding: 1.25rem; } }
</style>
</head>
<body>
<div class="card">

   <div class="screen active" id="s-form">
    <div class="encabezado">
      <div class="escudo">✦</div>
      <span class="badge">Reserva de turno ALCPT</span>
      <h1>Reserva de turno ALCPT</h1>
      <p>Selecciona tu turno disponible</p>
    </div>

    <div class="field">
      <label>Grado</label>
      <input type="text" id="f-grado" placeholder="Ej: ST, AT, T1, CR, TC" />
    </div>
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="f-nombre" placeholder="Nombre y apellidos" />
    </div>
    <div class="field">
      <label>Número de identificación </label>
      <input type="text" id="f-dep"  />
    </div>

    <div class="turnos-label">
      <span>Selecciona tu turno</span>
      <button class="refresh-btn" onclick="cargarCupos()" id="btn-refresh">↻ Actualizar</button>
    </div>
    <div class="turnos-grid" id="turnos-grid"></div>

    <div class="aviso-lleno" id="aviso-lleno">
      ✗ Este turno se llenó mientras completabas el formulario. Por favor selecciona otro.
    </div>

    <button class="btn btn-primary" id="btn-registrar" onclick="registrar()" disabled>
      Confirmar registro →
    </button>
    <div class="envio-estado" id="envio-estado"></div>
  </div>

  <div class="screen" id="s-exito">
    <div style="text-align:center; padding: 1rem 0;">
      <div class="exito-icon">✓</div>
      <h2 style="font-size:18px; font-weight:600; color:var(--gray-dark); margin-bottom:6px;">¡Registro exitoso!</h2>
      <p style="font-size:13px; color:var(--gray-mid);">Tu turno ha sido reservado correctamente.</p>
    </div>
    <div class="exito-card" id="exito-resumen"></div>
    <button class="btn btn-primary" style="margin-top:1rem" onclick="nuevoRegistro()">← Nuevo registro</button>
  </div>

</div>

<script>
// ════════════════════════════════════════════════════════
//  ⚙️  CONFIGURACIÓN — edita aquí los turnos y cupos
// ════════════════════════════════════════════════════════
const TURNOS = [
  { hora: "08:00 – 09:00", cupos: 1 },   // ← Turno 1
  { hora: "09:00 – 10:00", cupos: 2 },   // ← Turno 2
  { hora: "10:00 – 11:00", cupos: 5 },   // ← Turno 3
  { hora: "14:00 – 15:00", cupos: 5 },   // ← Turno 4
];
// ════════════════════════════════════════════════════════

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzn8iU1DW1036Q_VwdrTz3tDTROIlIgEqWLie-wK70_pfFwjHXcZMqFP_3h-3eeA3Wi/exec";

let ocupados = TURNOS.map(() => 0);
let turnoSeleccionado = null;
let cargando = false;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Skeletons mientras carga ──
function mostrarSkeletons() {
  const grid = document.getElementById('turnos-grid');
  grid.innerHTML = TURNOS.map(() => '<div class="skeleton"></div>').join('');
}

// ── Consultar cupos reales al Sheet ──
async function cargarCupos() {
  if (cargando) return;
  cargando = true;
  document.getElementById('btn-refresh').textContent = '↻ Cargando...';
  mostrarSkeletons();
  turnoSeleccionado = null;
  document.getElementById('btn-registrar').disabled = true;
  document.getElementById('aviso-lleno').classList.remove('visible');

  try {
    const url = APPS_SCRIPT_URL + "?action=consultarTurnos";
    const res  = await fetch(url);
    const json = await res.json();

    if (json.status === 'ok' && json.conteo) {
      ocupados = TURNOS.map(t => json.conteo[t.hora] || 0);
    }
  } catch(e) {
    // Si falla la consulta, muestra los turnos con conteo local (puede ser desactualizado)
    console.warn('No se pudo consultar cupos en tiempo real:', e);
  }

  cargando = false;
  document.getElementById('btn-refresh').textContent = '↻ Actualizar';
  renderTurnos();
}

// ── Render de tarjetas ──
function renderTurnos() {
  const grid = document.getElementById('turnos-grid');
  grid.innerHTML = '';
  TURNOS.forEach((t, i) => {
    const ocp   = ocupados[i];
    const libre = t.cupos - ocp;
    const pct   = Math.min(100, Math.round((ocp / t.cupos) * 100));
    const lleno = libre <= 0;
    const poco  = !lleno && libre <= 2;

    const tagClase  = lleno ? 'tag-lleno'  : poco ? 'tag-poco'  : 'tag-libre';
    const fillClase = lleno ? 'fill-lleno' : poco ? 'fill-poco' : 'fill-libre';
    const tagTexto  = lleno ? 'Lleno' : `${libre} cupo${libre !== 1 ? 's' : ''} libre${libre !== 1 ? 's' : ''}`;
    const sel = turnoSeleccionado === i;

    const d = document.createElement('div');
    d.className = 'turno' + (lleno ? ' lleno' : '') + (sel ? ' seleccionado' : '');
    d.innerHTML = `
      <div class="turno-info">
        <span class="turno-hora">${t.hora}</span>
        <span class="turno-desc">${ocp} de ${t.cupos} cupos ocupados</span>
      </div>
      <div class="turno-cupos">
        ${sel
          ? '<span class="tag-seleccionado">✓ Seleccionado</span>'
          : `<span class="cupos-texto ${tagClase}">${tagTexto}</span>`
        }
        <div class="cupos-bar"><div class="cupos-fill ${fillClase}" style="width:${pct}%"></div></div>
      </div>`;
    if (!lleno) d.onclick = () => seleccionarTurno(i);
    grid.appendChild(d);
  });
}

function seleccionarTurno(i) {
  turnoSeleccionado = i;
  document.getElementById('aviso-lleno').classList.remove('visible');
  renderTurnos();
  document.getElementById('btn-registrar').disabled = false;
}

// ── Registrar ──
async function registrar() {
  const grado  = document.getElementById('f-grado').value.trim();
  const nombre = document.getElementById('f-nombre').value.trim();
  const dep    = document.getElementById('f-dep').value.trim();

  if (!grado || !nombre) { alert('Por favor ingresa tu grado y nombre completo.'); return; }
  if (turnoSeleccionado === null) { alert('Por favor selecciona un turno.'); return; }

  const btn    = document.getElementById('btn-registrar');
  const estado = document.getElementById('envio-estado');
  btn.disabled = true;
  estado.className = 'envio-estado enviando';
  estado.textContent = '⏳ Registrando tu turno...';

  const turnoInfo = TURNOS[turnoSeleccionado];
  const datos = {
    accion: 'registroTurno',
    fecha:  new Date().toLocaleString('es-CO'),
    grado, nombre, dependencia: dep,
    turno:    turnoInfo.hora,
    turnoIdx: turnoSeleccionado,
    cuposMax: turnoInfo.cupos
  };

  try {
    const res  = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(datos)
    });
    const json = await res.json();

    if (json.status === 'lleno') {
      // El servidor confirmó que está lleno — actualizar UI
      ocupados[turnoSeleccionado] = turnoInfo.cupos;
      turnoSeleccionado = null;
      renderTurnos();
      estado.style.display = 'none';
      document.getElementById('aviso-lleno').classList.add('visible');
      btn.disabled = true;
      return;
    }

    // Éxito
    ocupados[turnoSeleccionado]++;
    const fecha = new Date().toLocaleString('es-CO', {
      day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    document.getElementById('exito-resumen').innerHTML =
      `<strong>${grado} ${nombre}</strong><br>${dep}<br><br>` +
      `Turno reservado: <strong>${turnoInfo.hora}</strong><br>` +
      `Boletín: <strong>06/2026 — DP 004/2022 SGSI</strong><br>` +
      `Fecha: <strong>${fecha}</strong>`;
    show('s-exito');

  } catch(e) {
    estado.className = 'envio-estado error';
    estado.textContent = '✗ No se pudo registrar. Verifica la conexión e intenta de nuevo.';
    btn.disabled = false;
  }
}

function nuevoRegistro() {
  document.getElementById('f-grado').value = '';
  document.getElementById('f-nombre').value = '';
  document.getElementById('f-dep').value = '';
  turnoSeleccionado = null;
  document.getElementById('btn-registrar').disabled = true;
  document.getElementById('envio-estado').style.display = 'none';
  document.getElementById('aviso-lleno').classList.remove('visible');
  show('s-form');
  cargarCupos(); // recarga cupos frescos al volver
}

// Cargar cupos al abrir la página
cargarCupos();
</script>
</body>
</html>
